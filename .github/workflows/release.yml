name: Release

# 推送 v* 标签触发：多平台桌面安装包 + 技能分支发布
# 本机（Windows SAC）无法编译 Rust，桌面包统一由 CI 出包
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── 桌面安装包：Windows(NSIS/MSI) + macOS(DMG) + Linux(deb/AppImage) ──
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Build & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CareLite-Essential ${{ github.ref_name }}'
          releaseBody: 'CareLite-Essential 桌面安装包。本地优先：数据仅存本机（PGlite），无需服务器。请按平台下载对应安装包。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── Skill 分支发布：WorkBuddy 可识别的技能目录 → skills 分支 ──
  publish-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Pack skills
        run: node scripts/pack-skills.mjs

      - name: Publish to skills branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: skills
          publish_dir: ./dist-skills
          force_orphan: true
          commit_message: 'chore: publish skills pack ${{ github.ref_name }}'
