[package]
name = "carelite-essential"
version = "0.1.0"
description = "CareLite-Essential - 开源健康师本地 AI 工作站"
authors = ["CareLite-Essential"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
